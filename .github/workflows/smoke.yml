
name: EpiTrace offline reproducibility

on:
  push:
  workflow_dispatch:

jobs:
  test-and-replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r track_2b/requirements.txt

      - name: Run offline tests
        run: make smoke

      - name: Reproduce saved results
        run: make replay

      - name: Test Docker entry point
        run: make run
